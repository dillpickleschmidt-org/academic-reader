# This file is for local development (not used in prod)
services:
  # GPU worker for local Marker processing
  # Profile: local
  marker:
    build: ./workers/marker
    profiles: ["local"]
    env_file:
      - .env.local
    volumes:
      - ./workers/marker/app:/app/app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # GPU worker for local LightOnOCR processing (balanced mode)
  # Profile: local
  lightonocr:
    build: ./workers/lightonocr
    profiles: ["local"]
    volumes:
      - ./workers/lightonocr/app:/app/app
    depends_on:
      minio:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # GPU worker for local Kokoro TTS (female_1, female_2)
  # Profile: local
  kokoro-tts:
    build: ./workers/kokoro-tts
    profiles: ["local"]
    volumes:
      - ./workers/kokoro-tts/app:/app/app
      - ./workers/kokoro-tts/core:/app/core
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # GPU worker for local Qwen3 TTS (male_1)
  # Profile: local
  qwen3-tts:
    build: ./workers/qwen3-tts
    profiles: ["local"]
    volumes:
      - ./workers/qwen3-tts/app:/app/app
      - ./workers/qwen3-tts/voices:/app/voices
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # MinIO S3-compatible storage for all dev profiles
  minio:
    image: minio/minio
    profiles: ["local", "datalab", "modal"]
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO bucket initialization
  minio-init:
    image: minio/mc
    profiles: ["local", "datalab", "modal"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/academic-reader --ignore-existing;
      mc anonymous set public myminio/academic-reader;
      mc ilm rule add myminio/academic-reader --prefix 'temp_documents/' --expire-days 7 2>/dev/null || true;
      exit 0;
      "

  # Cloudflare tunnel for exposing MinIO to Modal workers
  cloudflared:
    image: alpine:latest
    profiles: ["modal"]
    depends_on:
      minio:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O /usr/local/bin/cloudflared
        chmod +x /usr/local/bin/cloudflared
        cloudflared tunnel --url http://minio:9000 2>&1 | while IFS= read -r line; do
          echo "$$line"
          case "$$line" in *trycloudflare.com*)
            echo "$$line" | grep -oE 'https://[^ ]+' > /tunnel/url ;;
          esac
        done
    volumes:
      - tunnel_url:/tunnel

  # Self-hosted Convex backend
  # Profiles: all dev modes (local, datalab, modal)
  convex-backend:
    image: ghcr.io/get-convex/convex-backend:f96e9891f9097a4ca1f028d7aaa2a83e63b315a1
    profiles: ["local", "datalab", "modal"]
    ports:
      - "3210:3210"
      - "3211:3211"
    environment:
      - CONVEX_CLOUD_ORIGIN=http://localhost:3210
      - CONVEX_SITE_ORIGIN=http://localhost:3211
      - DISABLE_BEACON=true
    volumes:
      - convex_data:/convex/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3210/version"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Self-hosted Convex dashboard (opt-in with --dashboard flag)
  convex-dashboard:
    image: ghcr.io/get-convex/convex-dashboard:latest
    profiles: ["dashboard"]
    ports:
      - "6791:6791"
    environment:
      - NEXT_PUBLIC_DEPLOYMENT_URL=http://localhost:3210
    depends_on:
      convex-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6791"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  convex_data:
  tunnel_url:
